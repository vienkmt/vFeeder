appId: com.vfeeder.config
productName: vFeeder Config
directories:
  buildResources: resources
  output: release

# Bundle all dependencies - no network required
asar: true
asarUnpack:
  - "node_modules/serialport/**/*"
  - "node_modules/@serialport/**/*"

# Include all files
files:
  - "out/**/*"
  - "node_modules/**/*"
  - "package.json"

win:
  target:
    - target: nsis
      arch: [x64, ia32]
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: true
  artifactName: "vFeeder-Config-${version}-${arch}-setup.${ext}"
  # Bundle VC++ 2015 redistributable for Win7
  include: "resources/installer.nsh"
