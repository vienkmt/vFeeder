name: Build & Release vFeeder Config (Electron)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vfeeder-electron

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: vfeeder-electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild serialport for Electron
        run: npx @electron/rebuild -f -w serialport

      - name: Build Electron app
        run: npm run build

      - name: Package for Windows (x64 + ia32)
        run: npx electron-builder --win --x64 --ia32
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: vFeeder-Config-Windows-x64
          path: vfeeder-electron/release/*x64*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload ia32 installer
        uses: actions/upload-artifact@v4
        with:
          name: vFeeder-Config-Windows-ia32
          path: vfeeder-electron/release/*ia32*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          generate_release_notes: true
          files: |
            vfeeder-electron/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
