name: Build & Release vFeeder Config (Electron)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vfeeder-electron

jobs:
  build-windows:
    runs-on: windows-2019
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: vfeeder-electron/package-lock.json

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Visual Studio Build Tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies (skip native build)
        run: npm ci --ignore-scripts

      - name: Download prebuilt serialport bindings
        run: npx prebuild-install --runtime electron --target 22.3.27 --arch x64 -d node_modules/@serialport/bindings-cpp
        continue-on-error: true

      - name: Build Electron app
        run: npm run build

      - name: Package for Windows x64 only
        run: npx electron-builder --win --x64
        env:
          USE_HARD_LINKS: 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vFeeder-Config-Windows
          path: vfeeder-electron/release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          generate_release_notes: true
          files: |
            vfeeder-electron/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
